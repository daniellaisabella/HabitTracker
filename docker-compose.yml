services:
  backend:
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
    working_dir: /app
    volumes:
      - ./:/app
      - backend-venv:/app/.venv
    command: sh -c "uv sync --no-dev && uv run python -m backend.main"
    expose:
      - "5000"

  frontend:
    depends_on:
      - backend
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
    working_dir: /app
    volumes:
      - ./:/app
      - frontend-venv:/app/.venv
    command: sh -c "uv sync --no-dev && uv run streamlit run frontend/app.py --server.address=0.0.0.0 --server.port=8501"
    environment:
      - API_BASE=${API_BASE}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
    ports:
      - "8501:8501"

  db:
    image: postgres:14
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
  backend-venv:
  frontend-venv:
